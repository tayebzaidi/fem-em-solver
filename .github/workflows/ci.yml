name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install black isort flake8 mypy
    
    - name: Check formatting with black
      run: black --check --diff src tests
    
    - name: Check imports with isort
      run: isort --check-only --diff src tests
    
    - name: Lint with flake8
      run: flake8 src tests --max-line-length=100 --extend-ignore=E203,W503
    
    - name: Type check with mypy
      run: mypy src

  test:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.7.2
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install additional dependencies
      run: |
        pip install gmsh pyvista meshio h5py tqdm pydantic pyyaml
        pip install pytest pytest-xdist pytest-cov
    
    - name: Install package
      run: pip install -e ".[dev]"
    
    - name: Run lightweight unit tests (CI-safe)
      run: |
        pytest tests/unit -v --tb=short -x --cov=src --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml

  # Magnetostatics validation against analytic solutions.
  #
  # This exists because ~3,400 lines of test code previously ran nowhere: CI
  # covered only tests/unit, and tests/conftest.py auto-marks everything else
  # `slow`. Eleven defects accumulated behind that gap -- broken point
  # evaluation, a current density pointing the wrong way, an inverted
  # convergence-rate sign, meshes that exhausted memory. All were found the
  # first time the suite was actually executed. Keep this job green.
  validation:
    runs-on: ubuntu-latest
    # 25 -> 45 for MAG-13 steps 4-5: the analytic-Dirichlet loop test moved to
    # h = 0.002 (411k cells, 124 s at -n 2 on the dev box) and the convergence
    # test to three resolutions including 383k cells, taking the two files from
    # ~100 s to ~330 s locally. Runners are slower than the dev box, so the
    # margin under the old ceiling was gone.
    timeout-minutes: 45
    container:
      image: dolfinx/dolfinx:v0.7.2

    steps:
    - uses: actions/checkout@v4

    - name: Install additional dependencies
      run: |
        pip install gmsh pyvista meshio h5py tqdm pydantic pyyaml
        pip install pytest pytest-xdist

    - name: Install package
      run: pip install -e ".[dev]"

    - name: Smoke matrix
      run: ./run_tests.sh --smoke

    # TH-1 step 0. In real mode (this job's default) only the scalar-type /
    # dolfinx-build consistency test runs; the three complex-only tests skip.
    # That is still the guard worth having here: it catches a PETSC_ARCH that
    # disagrees with the imported dolfinx, which is how the old hardcoded
    # sitecustomize path handed back a real build under complex mode. The
    # complex half of this file now runs in the `validation-complex` job below
    # (OPS-10); keep both, they assert opposite things about the same shim.
    - name: Complex-mode environment gate (real-mode half)
      run: python3 -m pytest tests/environment -v --tb=short

    - name: Analytic validation (magnetostatics + PEC cavity resonances)
      # Measured 150s at 8 ranks on the dev box before MAG-13 steps 4-5; the
      # loop and convergence fixtures are now heavy tier (167 s and 196 s at
      # -n 2 on the dev box), so expect 15-25 min here. `slow` must be selected
      # explicitly since conftest.py marks every non-unit test with it. The
      # TH-9 cavity gate adds 3 s (measured at -n 2, TH-9 run of 2026-07-30).
      run: |
        mpiexec -n 2 python3 -m pytest \
          tests/validation/test_straight_wire.py \
          tests/validation/test_circular_loop.py \
          tests/validation/test_convergence.py \
          tests/validation/test_helmholtz_v2.py \
          tests/validation/test_helmholtz_magnitude.py \
          tests/validation/test_cavity_resonances.py \
          tests/solver/test_two_cylinder.py \
          tests/solver/test_two_torus.py \
          tests/solver/test_energy_and_point_evaluation.py \
          -v --tb=short

    # IO/materials/post. Two tests here used to be `--deselect`ed on the stale
    # DummyMagnetostaticSolver double (known-issues.md entry 1); TH-1 steps 1-3
    # deleted the `last_solve_diagnostics` read they tripped on, so the deselects
    # were removed 2026-07-31 and both files now also run in `validation-complex`
    # below, which is where the two `@complex_only` tests actually execute.
    - name: IO / materials / post suites
      run: |
        python3 -m pytest tests/io tests/materials tests/post -v --tb=short

  # Frequency-domain validation, complex PETSc scalars.
  #
  # This exists because `TH-1` steps 1-3 made TimeHarmonicSolver.solve() an
  # actual complex curl-curl solve, which cannot assemble in the real build at
  # all. Every test that solves in the frequency domain therefore moved behind
  # `@complex_only`, and since the `validation` job above runs real mode, CI
  # executed *no* time-harmonic solve for the whole of TH-1: the MMS
  # convergence gate, the lossy plane-wave closed form, and the resonance guard
  # all skipped silently. This job is the only place they run.
  #
  # FEM_EM_REQUIRE_COMPLEX=1 turns those skips into failures, so the job cannot
  # pass by skipping if the complex build fails to activate, and tests/environment
  # is listed first so an environment regression fails before the formulation
  # tests get blamed for it (PROJECT_PLAN §7 TH-1 step 0).
  validation-complex:
    runs-on: ubuntu-latest
    # 46 s at -n 2 on the dev box for the whole list below (OPS-10 run of
    # 2026-07-31), plus ~30 s for the POST-3 Poynting-balance file added
    # 2026-07-31 (four solves, one at 24^3, log
    # 20260731T140404Z_POST-3-step1-gate.log), plus ~16 s for the TH-8
    # dielectric-sphere file added 2026-07-31 (five gmsh solves up to 40k cells,
    # log 20260731T200457Z_TH-8-gate-final.log). Runners are slower and the
    # meshes are gmsh-generated, so 30 minutes is generous headroom rather than
    # a measured bound.
    timeout-minutes: 30
    container:
      image: dolfinx/dolfinx:v0.7.2

    steps:
    - uses: actions/checkout@v4

    - name: Install additional dependencies
      run: |
        pip install gmsh pyvista meshio h5py tqdm pydantic pyyaml
        pip install pytest pytest-xdist

    - name: Install package
      run: pip install -e ".[dev]"

    # `source` sets PETSC_ARCH, PYTHONPATH and LD_LIBRARY_PATH for the complex
    # build; unlike the container chunk commands we do not override PYTHONPATH
    # afterwards, so src/sitecustomize.py is not involved here.
    - name: Complex-mode frequency-domain validation
      run: |
        source /usr/local/bin/dolfinx-complex-mode
        FEM_EM_REQUIRE_COMPLEX=1 mpiexec -n 2 python3 -m pytest \
          tests/environment \
          tests/validation/test_time_harmonic_mms.py \
          tests/validation/test_lossy_plane_wave.py \
          tests/validation/test_waveguide_cutoff.py \
          tests/validation/test_dielectric_sphere.py \
          tests/validation/test_poynting_balance.py \
          tests/validation/test_resonance_guard.py \
          tests/validation/test_dodd_deeds_impedance.py \
          tests/solver/test_time_harmonic_smoke.py \
          tests/solver/test_boundary_condition_selection.py \
          tests/materials/test_phantom_material_model.py \
          tests/post/test_phantom_field_metrics.py \
          -v --tb=short

    # test_dodd_deeds_impedance.py is the `MAT-6` loading gate and costs 85 s of
    # the total (one 138k-cell mesh, three solves, measured at -n 2 on the dev
    # box, log 20260731T110515Z_MAT-6-step2b-gate-numbers.log). Its step-1 half
    # runs in either build, but the file is listed only here so the FEM half is
    # actually executed rather than skipped.

    # The two phantom files were added 2026-07-31 when known-issues.md entry 1
    # was retired; they cost 6 s at -n 2 (10 passed, log
    # 20260731T170034Z_KI-1-precheck-complex.log). One `@complex_only` test is
    # still deliberately absent: test_convergence_diagnostics.py (known-issues.md
    # entry 2, whose non-complex sibling fails too). Add it here in the commit
    # that fixes that entry.

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install "mkdocs<2" mkdocs-material "mkdocstrings[python]"
    
    - name: Build documentation
      run: mkdocs build --strict
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
