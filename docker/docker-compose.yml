services:
  fem-em-solver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: fem-em-solver:latest
    container_name: fem-em-solver
    volumes:
      - ..:/workspace
      - fem-em-cache:/root/.cache
    ports:
      - "8888:8888"  # Jupyter
    environment:
      # OPS-18 (0.7.2 -> 0.11.0): the image's Python moved 3.10 -> 3.12. The
      # dolfinx-{real,complex}-mode wrappers derive this tag themselves, and so
      # does src/sitecustomize.py; this literal is the one place it is pinned.
      - PYTHONPATH=/usr/local/dolfinx-real/lib/python3.12/dist-packages:/usr/local/lib:/workspace/src
      - MPLBACKEND=Agg
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    deploy:
      resources:
        # Raised 64G -> 128G by operator directive 2026-08-24 (interactive
        # session). The host has 754 GiB total / 743 GiB free, so this is ~17%
        # of a shared box, not a claim on all of it. Chunks must not raise it
        # further on their own -- see the standing constraint in PROJECT_PLAN
        # section 9. Several adjudicated results (TH-11 step 5, TH-12, OPS-17's
        # coil_loading_degree2 deferral) were negatives measured against the
        # old 64 GiB wall and may now be reachable; the reviews decide that,
        # not an implementer slot.
        limits:
          memory: 128G
        reservations:
          memory: 4G

volumes:
  fem-em-cache:
